
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldMaster Ultra Elite v5.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #02040a;
            color: #f8fafc;
            margin: 0;
            overflow-x: hidden;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #02040a;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
        #app-error {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #111;
            border: 2px solid #ef4444;
            padding: 2rem;
            border-radius: 1rem;
            z-index: 9999;
            text-align: center;
            max-width: 80%;
        }
        #boot-loader {
            transition: opacity 0.5s ease-out;
        }
    </style>
    <script>
        // Safety Shim
        if (typeof window.process === 'undefined') {
            window.process = { env: { API_KEY: '' } };
        }
        
        // Global Error Handler to catch "Black Screen" causes
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            console.error('App Error Detected:', msg, url, lineNo);
            const errorDiv = document.getElementById('app-error');
            if (errorDiv) {
                errorDiv.style.display = 'block';
                errorDiv.innerHTML = `
                    <h2 style="color: #ef4444; font-weight: 900; margin-bottom: 1rem;">⚠️ SYSTEM CRASH DETECTED</h2>
                    <p style="font-size: 12px; color: #94a3b8; font-family: monospace;">${msg}</p>
                    <button onclick="location.reload()" style="margin-top: 1.5rem; background: #3b82f6; color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer;">
                        RELOAD SYSTEM
                    </button>
                `;
            }
            return false;
        };
    </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react/": "https://esm.sh/react@19.0.0/",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/": "https://esm.sh/react-dom@19.0.0/",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "recharts": "https://esm.sh/recharts@2.15.0?external=react,react-dom"
  }
}
</script>
</head>
<body>
    <div id="root">
        <!-- Initial Loading State -->
        <div id="boot-loader" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 1rem; background: #02040a; position: fixed; inset: 0; z-index: 100;">
            <div style="width: 50px; height: 50px; border: 4px solid #1e293b; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.5em; color: #3b82f6; font-weight: 900;">BOOTING GOLDMASTER v5.5</div>
        </div>
    </div>
    <div id="app-error"></div>
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</body>
</html>
